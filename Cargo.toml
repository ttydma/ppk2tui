[package]
name = "ppk2tui"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "ppk2tui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
serialport = { version = "4.6", default-features = false }
ratatui = "0.29"
crossterm = "0.28"

# Build-only: stamps the build date into the binary. Not linked into the
# shipped executable.
[build-dependencies]
time = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
